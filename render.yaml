# Render Blueprint for Anvil DevTools.
# https://render.com/docs/blueprint-spec
#
# After the first deploy, fill in the secrets (DATABASE_URL,
# SUPABASE_SERVICE_ROLE_KEY, IP_HMAC_SECRET, SECRET_KEY, etc.) via the
# Render dashboard. They MUST NOT be committed to this file.

services:
  # ── Web service (Flask app) ───────────────────────────────────────────────
  # Serves the public site, /api/contact, /api/analytics/*, and /admin/*.
  # The in-process delivery worker is DISABLED here — a dedicated
  # Background Worker (below) handles queue delivery so we never start
  # multiple worker threads competing on the same SQLite outbox.
  - type: web
    name: anvil-devtools
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Python version (native build). Must match .python-version.
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      # Generated by Render automatically. No manual entry.
      - key: SECRET_KEY
        generateValue: true
      - key: IP_HMAC_SECRET
        generateValue: true
      # Set to your service URL. Change it if Render gave the service a different name.
      - key: SITE_URL
        value: https://anvil-devtools.onrender.com
      # ── You must enter these in the Render dashboard (secrets) ──
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # ── Fixed settings (no action needed) ──
      - key: WEB_CONCURRENCY
        value: "1"
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: SUPABASE_SSL_ROOT_CERT
        value: /etc/secrets/supabase-ca.crt
      - key: SUPABASE_WORKER_ENABLED
        value: "1"
      - key: SUPABASE_QUEUE_PATH
        value: /tmp/anvil-outbox.sqlite3
      - key: OUTBOX_DURABLE
        value: "0"
      - key: SUPABASE_QUEUE_LEASE_SECONDS
        value: "300"
      - key: SUPABASE_CONNECT_TIMEOUT
        value: "5"
      - key: SUPABASE_STATEMENT_TIMEOUT
        value: "10"
      - key: SUPABASE_RETRY_BASE_DELAY_SECONDS
        value: "2"
      - key: SUPABASE_RETRY_MAX_DELAY_SECONDS
        value: "900"
      - key: SUPABASE_MAX_QUEUE_ITEMS
        value: "10000"

  # ── Background Worker (queue delivery) ────────────────────────────────────
  # Runs the durable delivery loop as a single process.
  #
  # IMPORTANT: Two separate Render services DO NOT share a filesystem.
  # The web service and this Background Worker each get their own
  # ephemeral /tmp. Setting SUPABASE_QUEUE_PATH to the same value on
  # both services does NOT make them share the queue file — each
  # service gets its own copy at that path.
  #
  # To actually share durable queue state between the web service and
  # the Background Worker, you MUST use ONE of:
  #
  #   1. Mount a persistent disk on the web service ONLY and run the
  #      in-process worker there (SUPABASE_WORKER_ENABLED=1 on the web
  #      service, no Background Worker needed). This is Option A in
  #      docs/supabase-retry-and-queue.md.
  #
  #   2. Replace the SQLite outbox with an external durable queue
  #      (Redis, SQS, Cloud Tasks). This is Option B1 in the docs.
  #
  # The block below is commented out because Option A (in-process
  # worker on the web service) is simpler and works without an
  # external queue backend. Uncomment ONLY if you have set up an
  # external queue per Option B1.
  #
  # - type: worker
  #   name: anvil-delivery-worker
  #   runtime: docker
  #   plan: starter   # Background Workers require a paid plan
  #   dockerfilePath: ./Dockerfile
  #   dockerCommand: python -m delivery.worker_cli --batch 10 --interval 5
  #   envVars:
  #     - key: SECRET_KEY
  #       sync: false
  #     - key: DATABASE_URL
  #       sync: false
  #     - key: SUPABASE_SERVICE_ROLE_KEY
  #       sync: false
  #     # The external queue URL (Redis, SQS, etc.). The web service
  #     # must connect to the SAME URL.
  #     # - key: REDIS_URL
  #     #   sync: false
  #     - key: SUPABASE_WORKER_ENABLED
  #       value: "1"
  #     - key: SUPABASE_RETRY_BASE_DELAY_SECONDS
  #       value: "2"
  #     - key: SUPABASE_RETRY_MAX_DELAY_SECONDS
  #       value: "900"

  # ── Optional daily backup cron job. See docs/backup-and-recovery.md. ──────
  # Uncomment and fill in the secrets to enable.
  #
  # - type: cron
  #   name: anvil-backup
  #   runtime: docker
  #   plan: starter
  #   schedule: "0 3 * * *"   # 03:00 UTC daily
  #   dockerfilePath: ./Dockerfile
  #   envVars:
  #     - key: DATABASE_URL
  #       sync: false
  #     - key: AWS_ACCESS_KEY_ID
  #       sync: false
  #     - key: AWS_SECRET_ACCESS_KEY
  #       sync: false
  #     - key: BACKUP_S3_BUCKET
  #       sync: false
  #     - key: BACKUP_GPG_PASSPHRASE
  #       sync: false
  #   dockerCommand: /bin/sh -c "pip install awscli && ./scripts/backup-database.sh"
